name: OSS-Fuzz CMake Prototype

on:
  push:
    branches:
      - issue-6033-cmake-json-prototype

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MsQuic
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone OSS-Fuzz
        run: |
          git clone --depth=1 \
            https://github.com/google/oss-fuzz.git \
            "$RUNNER_TEMP/oss-fuzz"

      - name: Configure CMake build script
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          cat > projects/msquic/build.sh <<'SCRIPT'
          #!/bin/bash -eu

          export CFLAGS="$CFLAGS -Wno-error=invalid-unevaluated-string"
          export CXXFLAGS="$CXXFLAGS -Wno-error=invalid-unevaluated-string"

          # Configure MsQuic using its existing build script.
          pwsh ./scripts/build.ps1 \
              -Static \
              -DisableTest \
              -DisablePerf \
              -DisableLogs \
              -Parallel 1 \
              -ConfigureOnly

          BUILD_CONFIG=$(find "$PWD/build" \
              -name 'msquic-config.cmake' -print -quit)
          test -n "$BUILD_CONFIG"
          BUILD_DIR=$(dirname "$BUILD_CONFIG")

          # Enable the new CMake fuzzer target.
          cmake -S "$PWD" -B "$BUILD_DIR" \
              -DQUIC_BUILD_FUZZERS=ON

          # Build only the first fuzzer.
          cmake --build "$BUILD_DIR" \
              --target datapath_raw_fuzz \
              --parallel 1

          # Deliver the fuzzer executable to OSS-Fuzz.
          install -m 755 \
              "$BUILD_DIR/fuzzers/datapath_raw_fuzz" \
              "$OUT/datapath_raw_fuzz"
          SCRIPT

          chmod +x projects/msquic/build.sh

      - name: Build datapath_raw_fuzz
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          python3 infra/helper.py build_fuzzers \
            --clean \
            --engine libfuzzer \
            --sanitizer address \
            msquic \
            "$GITHUB_WORKSPACE"

      - name: Verify fuzzer executable
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          ls -lh build/out/msquic
          test -x build/out/msquic/datapath_raw_fuzz

      - name: Check datapath_raw_fuzz
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          python3 infra/helper.py check_build \
            --engine libfuzzer \
            --sanitizer address \
            msquic \
            datapath_raw_fuzz
