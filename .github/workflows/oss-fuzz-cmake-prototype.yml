name: OSS-Fuzz CMake Prototype

on:
  push:
    branches:
      - issue-6033-oss-fuzz-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MsQuic
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clone OSS-Fuzz
        run: |
          git clone --depth=1 \
            https://github.com/google/oss-fuzz.git \
            "$RUNNER_TEMP/oss-fuzz"

      - name: Configure CMake build script
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          cat > projects/msquic/build.sh <<'SCRIPT'
          #!/bin/bash -eu

          export CFLAGS="${CFLAGS:-} -Wno-error=invalid-unevaluated-string"
          export CXXFLAGS="${CXXFLAGS:-} -Wno-error=invalid-unevaluated-string"

          pwsh ./scripts/build.ps1 -ForFuzzing -Parallel 1
          echo "=== CMake configuration ==="
          grep -E '^(CMAKE_GENERATOR|CMAKE_BUILD_TYPE):' \
              "$SRC/msquic/build/linux/x64_quictls/CMakeCache.txt" || true

          echo "=== Fuzzer output locations ==="
          find "$SRC/msquic/build" "$SRC/msquic/artifacts" \
              \( -name datapath_raw_fuzz -o -name fuzz -o -name spinquic \) \
              -print || true

          pwsh ./scripts/oss-fuzz-binplace.ps1
          SCRIPT

          chmod +x projects/msquic/build.sh

      - name: Build datapath_raw_fuzz
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          python3 infra/helper.py build_fuzzers \
            --clean \
            --engine libfuzzer \
            --sanitizer address \
            msquic \
            "$GITHUB_WORKSPACE"

      - name: Verify manifest packaging
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          out = Path(os.environ["RUNNER_TEMP"]) / "oss-fuzz/build/out/msquic"

          manifest = json.loads(
              (repo / "src/fuzzing/oss-fuzz.json").read_text()
          )
          expected = {entry["name"] for entry in manifest["targets"]}

          # Exclude the OSS-Fuzz infrastructure executable.
          infrastructure = {"llvm-symbolizer"}

          actual = {
              path.name
              for path in out.iterdir()
              if path.is_file()
              and os.access(path, os.X_OK)
              and path.name not in infrastructure
          }

          print("Expected:", sorted(expected))
          print("Packaged:", sorted(actual))

          assert actual == expected, (
              f"Packaging mismatch: expected {expected}, got {actual}"
          )

          expected_options = {
              f'{entry["name"]}.options'
              for entry in manifest["targets"]
              if "options" in entry
          }

          actual_options = {
              path.name
              for path in out.glob("*.options")
          }

          print("Expected options:", sorted(expected_options))
          print("Packaged options:", sorted(actual_options))

          assert actual_options == expected_options
          PY

      - name: Check all packaged fuzzers
        working-directory: ${{ runner.temp }}/oss-fuzz
        run: |
          python3 infra/helper.py check_build \
            --engine libfuzzer \
            --sanitizer address \
            msquic
