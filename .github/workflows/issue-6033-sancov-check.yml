name: Issue 6033 Sanitizer Coverage Check

on:
  push:
    branches:
      - issue-6033-sancov-check

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build instrumented MsQuic
        shell: bash
        run: |
          set -euxo pipefail

          FLAGS="-g -fsanitize=fuzzer-no-link -Wno-error=invalid-unevaluated-string"

          CC=clang CXX=clang++ \
          CFLAGS="$FLAGS" CXXFLAGS="$FLAGS" \
          cmake -S . -B build/issue6033-sancov \
            -DQUIC_BUILD_SHARED=OFF \
            -DQUIC_BUILD_TEST=OFF \
            -DQUIC_BUILD_TOOLS=OFF \
            -DQUIC_BUILD_PERF=OFF \
            -DQUIC_ENABLE_LOGGING=OFF \
            -DQUIC_ENABLE_ASAN=ON \
            -DQUIC_SKIP_SANITIZE_SUBMODULES=ON \
            -DQUIC_TLS_LIB=quictls

          cmake --build build/issue6033-sancov \
            --target msquic_lib --parallel 2

      - name: Verify parser instrumentation
        shell: bash
        run: |
          set -euxo pipefail

          LIB="build/issue6033-sancov/bin/Release/libmsquic.a"

          test -f "$LIB"

          ar t "$LIB" | grep 'datapath_raw_parse'

          nm -A "$LIB" > /tmp/msquic-symbols.txt

          grep 'datapath_raw_parse' /tmp/msquic-symbols.txt |
            grep '__sanitizer_cov_8bit_counters_init'

          grep 'datapath_raw_parse' /tmp/msquic-symbols.txt |
            grep '__sanitizer_cov_pcs_init'

          echo "$LIB" > /tmp/msquic-library-path

      - name: Build fuzz target
        shell: bash
        run: |
          set -euxo pipefail

          clang \
            -g -O1 \
            -fsanitize=fuzzer-no-link,address \
            -I"$GITHUB_WORKSPACE/src/platform" \
            -I"$GITHUB_WORKSPACE/src/inc" \
            -c src/fuzzing/datapath_raw_fuzz.c \
            -o /tmp/datapath_raw_fuzz.o

          LIB="$(cat /tmp/msquic-library-path)"

          clang++ \
            -g \
            -fsanitize=fuzzer,address \
            /tmp/datapath_raw_fuzz.o \
            "$LIB" \
            -o /tmp/datapath_raw_fuzz

      - name: Generate initial corpus
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /tmp/raw-corpus

          python3 - <<'PY'
          from pathlib import Path

          # Source:
          # src/platform/unittest/RawDataPathTest.cpp
          # InitializeIpv4UdpFrame()

          ethernet = bytes.fromhex(
              "02 00 00 00 00 01"
              " 02 00 00 00 00 02"
              " 08 00"
          )

          ipv4 = bytes.fromhex(
              "45 2a 00 20"
              " 00 00 00 00"
              " 40 11 00 00"
              " c0 00 02 01"
              " c0 00 02 02"
          )

          udp = bytes.fromhex(
              "c3 50 01 bb"
              " 00 0c 00 00"
          )

          payload = bytes.fromhex("de ad be ef")

          frame = ethernet + ipv4 + udp + payload

          assert len(frame) == 46

          Path("/tmp/raw-corpus/ipv4_udp").write_bytes(frame)
          PY

      - name: Run coverage-guided fuzzing
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /tmp/raw-artifacts

          /tmp/datapath_raw_fuzz \
            /tmp/raw-corpus \
            -max_total_time=10800 \
            -max_len=1500 \
            -artifact_prefix=/tmp/raw-artifacts/ \
            -print_final_stats=1 \
            2>&1 | tee /tmp/fuzz.log

      - name: Upload failure-inducing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-datapath-failure-inputs
          path: /tmp/raw-artifacts/
          if-no-files-found: ignore
